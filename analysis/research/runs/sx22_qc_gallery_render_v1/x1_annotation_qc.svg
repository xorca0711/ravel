  </g>
  <g id="text_34">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="37.8" y="68.04" transform="rotate(-0 37.8 68.04)">52 repeated labels span 122 deposited annotation rows. The exact annotation release remains unknown.</text>
  </g>
  <g id="text_35">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="37.8" y="408.24" transform="rotate(-0 37.8 408.24)">Panel A bins form a partition of the 52 labels. Panel B dimensions overlap: do not add them as mutually exclusive categories.</text>
  </g>
  <g id="text_36">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="37.8" y="441" transform="rotate(-0 37.8 441)">A coordinate tuple is (chromosome, strand, start, end). Counts describe deposited annotation records, without remapping or collapsing rows.</text>
  </g>
  <g id="text_37">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="37.8" y="473.76" transform="rotate(-0 37.8 473.76)">This is technical metadata QC, not expression analysis, named-target ranking or a functional result. Values reuse the frozen X1 summary.</text>
