   <g id="text_1">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="24.63192" y="82.086281" transform="rotate(-0 24.63192 82.086281)">Observed RNA</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="206.87472" y="82.086281" transform="rotate(-0 206.87472 82.086281)">Working question</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="404.96472" y="82.086281" transform="rotate(-0 404.96472 82.086281)">Decisive first comparison</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="610.97832" y="82.086281" transform="rotate(-0 610.97832 82.086281)">Alternative / informative failure</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(24.63192 116.400812)">Tigit and Prdm1 decrease.</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(24.63192 130.030812)">Areg interaction is fragile.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(206.87472 116.400812)">Does Ezh2 loss impair inducible</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(206.87472 130.030812)">TIGIT–Blimp-1 output in viable</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(206.87472 143.660812)">activated Tregs?</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(404.96472 116.831891)">Matched HET/KO activation, with</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(404.96472 130.030812)">versus without TIGIT engagement:</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(404.96472 143.660812)">surface TIGIT, Blimp-1 and secreted</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(404.96472 157.290812)">AREG per viable cell.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(610.97832 116.400812)">Equal output despite RNA changes</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(610.97832 130.030812)">weakens this route. A general</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(610.97832 144.571437)">activation or survival defect can</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(610.97832 157.290812)">mimic it. Repair needs its own</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(610.97832 170.920812)">functional assay.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(24.63192 216.192812)">Ccr2 decreases, together with</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(24.63192 230.733437)">several other chemokine</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(24.63192 243.181828)">receptors.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(206.87472 217.103437)">Does reduced CCR2 contribute to</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(206.87472 230.253891)">altered localization, cell fitness,</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(206.87472 243.452812)">or simply mark a changed Treg</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(206.87472 257.910453)">state?</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(404.96472 216.192812)">Measure CCR2 protein, direct</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(404.96472 229.822812)">chemotaxis, CD25/IL-2 response and</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(404.96472 243.452812)">viable recovery as separate</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(404.96472 257.082812)">endpoints.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(610.97832 216.192812)">Abundance is not migration.</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(610.97832 229.822812)">Migration preserved with altered</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(610.97832 244.363437)">fitness favors a different</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(610.97832 257.082812)">explanation; shared-state shifts</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(610.97832 270.712812)">can explain both.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(24.63192 315.984812)">Igfbp4 increases. External</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(24.63192 329.614812)">H3K27me3 context is compatible</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(24.63192 344.155437)">but unmatched.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(206.87472 315.984812)">Is IGFBP4 a functional growth-</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(206.87472 329.614812)">factor buffer, a compensatory</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(206.87472 343.244812)">response, or a population marker?</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(404.96472 315.984812)">First confirm Treg-source protein.</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(404.96472 329.614812)">Then perturb IGFBP4 under defined</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(404.96472 343.244812)">IGF exposure and measure signaling,</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(404.96472 356.874812)">survival and suppression</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(404.96472 370.504812)">separately.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(610.97832 315.984812)">Absent protein or unchanged</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(610.97832 330.525437)">function weakens the mediator</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(610.97832 343.244812)">model. Opposite effects support</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(610.97832 356.874812)">compensation; IGF effects depend on</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'" transform="translate(610.97832 371.415437)">cell state.</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start" x="15.1236" y="34.182787" transform="rotate(-0 15.1236 34.182787)">From candidate to a discriminating experiment</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="15.1236" y="54.715237" transform="rotate(-0 15.1236 54.715237)">PROPOSED comparisons · no pathway mediation, secretion or repair function established by this screen</text>
   </g>
   <g id="text_19">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(15.1236 422.101654)">Premises: TIGIT study (2025), CCR2 study (2018) and IGF study (2020); exact locators in TARGET_SCREEN_RESULT.md.</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(15.1236 432.303978)">Unit: independently obtained mouse/preparation; wells are technical. Effect margin, sample size and laboratory feasibility remain unspecified.</text>
   </g>
  </g>
 </g>
