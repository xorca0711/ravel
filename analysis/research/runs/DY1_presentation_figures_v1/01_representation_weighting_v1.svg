  <g id="caption">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #24313b" transform="translate(46.728 518.813437)">Equal-gene weighting changes agreement only slightly; mixed ATAC directions remain common in the broad mapped universe.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #24313b" transform="translate(46.728 532.313437)">Rows and genes share source libraries. No independent-trial inference; similar mappings are not independent validation.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #24313b" transform="translate(46.728 545.813437)">All mapped rows remain in denominators. Distance is to the source nearest TSS, not necessarily the Ensembl-assigned gene.</text>
  </g>
 </g>
