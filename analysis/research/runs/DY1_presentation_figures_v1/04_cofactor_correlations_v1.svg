  <g id="caption">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #24313b" transform="translate(46.728 518.813437)">Compare mapped-row associations on the full Spearman scale: the saved global RNA-accessibility correlations are weak.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #24313b" transform="translate(46.728 532.313437)">Mapped rows share genes and source libraries; no confidence interval or p-value is inferred from their count.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #24313b" transform="translate(46.728 545.813437)">Separate source-labelled IL4/CTRL comparisons are not an interaction, causal mechanism or evidence of true absence.</text>
