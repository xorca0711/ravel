name: Research governance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  research-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check research contracts and historical integrity
        run: python analysis/scripts/research_gate.py check
      - name: Check changed scientific assets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != '0000000000000000000000000000000000000000' ]; then
            python analysis/scripts/research_gate.py check --base "$BASE_SHA"
          else
            python analysis/scripts/research_gate.py check --base "$(git merge-base HEAD origin/main)"
          fi
      - name: Exercise contract rejection and execution behavior
        run: python -m unittest discover -s analysis/tests -p test_research_governance.py -q
