name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q -x '[/\\]\.tools[/\\]' analysis "Research Article" RQ_Specified
      - name: Test evidence and provenance contracts
        run: python -m unittest discover -s analysis/tests -q
      - name: Check generated claim manifest and summaries
        run: python analysis/scripts/claim_contract.py --check
      - name: Verify tracked Nb1 evidence
        run: python "Research Article/gate1_03_nabhan_2018/nb1/verify_outputs.py"
      - name: Verify archived Nb4 atlas evidence
        run: python "Research Article/gate2_N3_travaglini_nabhan_lung_atlas_2020/scripts/verify_archive.py"
      - name: Verify archived A16 Stage 1 evidence
        run: python RQ_Specified/A16_cd177_state_attribution/scripts/verify_stage1_evidence.py
      - name: Verify archived A23 external analysis
        run: python RQ_Specified/A23_slc34a2_transition_homeostasis/scripts/08_verify_external_current.py
      - name: Verify A22 and A23 extension evidence
        run: python analysis/scripts/verify_a22_a23_extensions.py
      - name: Validate tracked artefacts and documentation
        run: python analysis/scripts/validate_repository.py
