<text x="60" y="844" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#168F91">WHAT THE READOUTS WOULD LET YOU DECIDE</text>
<rect x="60" y="863" width="476" height="162" rx="12" fill="#F5F7FA" stroke="#F5F7FA" stroke-width="2"/>
<text x="80" y="895.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#20323C">Published premise</text>
<text x="80" y="933" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">CEBPA supports AT2 identity. Broad attenuation is</text>
<text x="80" y="958" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">not the new contribution.</text>
<rect x="562" y="863" width="476" height="162" rx="12" fill="#F5F7FA" stroke="#F5F7FA" stroke-width="2"/>
<text x="582" y="895.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#20323C">Independent starting state</text>
<text x="582" y="933" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">Define state before genotype changes labels,</text>
<text x="582" y="958" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">composition or survival.</text>
<rect x="1064" y="863" width="476" height="162" rx="12" fill="#F5F7FA" stroke="#F5F7FA" stroke-width="2"/>
<text x="1084" y="895.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#20323C">Interaction needs precision</text>
<text x="1084" y="933" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">No significant interaction is not equivalence. Keep</text>
<text x="1084" y="958" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">CEBPA and AP-1 studies separate.</text>
<text x="60" y="1059" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#5B6D77">Current evidence: Baseline-state definition and pool identities remain unresolved. No specific state-dependent functional route is nominated.</text>
