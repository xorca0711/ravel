<text x="1084" y="895.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#20323C">What decides the question</text>
<text x="1084" y="933" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">Within-clone acquisition favors sequence. Subset</text>
<text x="1084" y="958" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">replacement favors selection.</text>
<text x="60" y="1059" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#5B6D77">Current evidence: No linked acute sequence is established. Generic AT2 flexibility is known; a Fzd5-specific entry gate was not adopted.</text>
