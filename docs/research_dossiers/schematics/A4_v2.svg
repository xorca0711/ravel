<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc"><title id="title">A4</title><desc id="desc">Original hypothesis illustration. Arrows show the labeled proposed comparison, not observed results. Cell counts and shapes are qualitative. Read the full caption and sources.</desc>
<rect x="0" y="0" width="1600" height="1200" rx="0" fill="white" stroke="white" stroke-width="2"/>
<text x="60" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#168F91">A4  /  HYPOTHESIS AND RIVAL</text>
<text x="1540" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="end" fill="#7951B2">CONDITIONAL BIOLOGICAL COMPARISON</text>
<text x="60" y="101.0" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="600" text-anchor="start" fill="#20323C">Does the same AT2 lineage acquire an IL-1 response?</text>
<text x="60" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">Adult AT2 starting lineages with documented Wnt-responsive history can later acquire an IL-1-beta-responsive transitional epithelial state, rather than</text>
<text x="60" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">the apparent sequence arising only from expansion or survival of different pre-existing subsets. Wnt history, current Wnt activity and current IL-1</text>
<text x="60" y="223" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">response must be measured separately. This restores the existing sequence question; it does not adopt the proposed Fzd5-dependent gate on transition</text>
<text x="60" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">entry.</text>
