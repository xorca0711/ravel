<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc"><title id="title">A12</title><desc id="desc">Original hypothesis illustration. Arrows show the labeled proposed comparison, not observed results. Cell counts and shapes are qualitative. Read the full caption and sources.</desc>
<rect x="0" y="0" width="1600" height="1200" rx="0" fill="white" stroke="white" stroke-width="2"/>
<text x="60" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#168F91">A12  /  HYPOTHESIS AND RIVAL</text>
<text x="1540" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="end" fill="#BC653D">SPECIFICATION GAP REMAINS</text>
<text x="60" y="101.0" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="600" text-anchor="start" fill="#20323C">Which recipient context makes an IL-1 response specific?</text>
<text x="60" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">IL-1 receptor and inhibitory context in recipient epithelial cells or fibroblasts may explain an IL-1-dependent response beyond ligand RNA abundance.</text>
<text x="60" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">Those are separate recipient questions; the current portfolio has not fixed one compartment, receptor/inhibitory contrast and biological consequence for</text>
<text x="60" y="223" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">a mechanistic experiment. General NF-kB or inflammation scores cannot establish IL-1 specificity.</text>
