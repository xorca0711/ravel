<text x="60" y="844" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#168F91">WHAT THE READOUTS WOULD LET YOU DECIDE</text>
<rect x="60" y="863" width="476" height="162" rx="12" fill="#F5F7FA" stroke="#F5F7FA" stroke-width="2"/>
<text x="80" y="895.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#20323C">Validate the source contrast</text>
<text x="80" y="933" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">Comparable receptor engagement, AF1 identity and</text>
<text x="80" y="958" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">fibroblast viability are required.</text>
<rect x="562" y="863" width="476" height="162" rx="12" fill="#F5F7FA" stroke="#F5F7FA" stroke-width="2"/>
<text x="582" y="895.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#20323C">Early and late endpoints</text>
<text x="582" y="933" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">Measure the competent early pool separately from</text>
<text x="582" y="958" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">total later mature output.</text>
<rect x="1064" y="863" width="476" height="162" rx="12" fill="#F5F7FA" stroke="#F5F7FA" stroke-width="2"/>
<text x="1084" y="895.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#20323C">Avoid false mediation</text>
<text x="1084" y="933" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">Do not adjust away the depleted early pool. Timing</text>
<text x="1084" y="958" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">alone does not prove mediation.</text>
<text x="60" y="1059" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#5B6D77">Current evidence: Fzd2-dependent repair is already published. The candidate increment is the matched Fzd2/Fzd1 and early-pool/late-output contrast.</text>
