<text x="1540" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="end" fill="#168F91">PROPOSED / QUALIFICATION REMAINS</text>
<text x="60" y="101.0" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="600" text-anchor="start" fill="#20323C">Does aged bladder stroma impair urothelial barrier maintenance?</text>
<text x="60" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">An age-associated change in a specified bladder stromal population reduces urothelial barrier maintenance beyond epithelial age and terminal</text>
<text x="60" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">differentiation alone. This is a proposed intercompartmental contribution, not a conclusion from the atlas. The particular stromal population and</text>
<text x="60" y="223" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">mechanism remain open.</text>
