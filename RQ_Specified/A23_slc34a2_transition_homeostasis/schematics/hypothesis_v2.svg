<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc"><title id="title">A23</title><desc id="desc">Original hypothesis illustration. Arrows show the labeled proposed comparison, not observed results. Cell counts and shapes are qualitative. Read the full caption and sources.</desc>
<rect x="0" y="0" width="1600" height="1200" rx="0" fill="white" stroke="white" stroke-width="2"/>
<text x="60" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#168F91">A23  /  HYPOTHESIS AND RIVAL</text>
<text x="1540" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="end" fill="#7951B2">CONDITIONAL BIOLOGICAL COMPARISON</text>
<text x="60" y="101.0" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="600" text-anchor="start" fill="#20323C">Does SLC34A2 loss increase transition entry or delay exit?</text>
<text x="60" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">SLC34A2 transport impairment may increase acquisition of a transition-associated epithelial stress state before broad AT2 identity loss, rather than</text>
<text x="60" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">merely prolong an existing intermediate state by impairing exit to AT1 maturation. This entry-versus-residence distinction narrows the original proposal.</text>
<text x="60" y="223" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">Phosphate-dependent repair failure and the Slc34a2-loss transitional RNA module already have published precedents; the mechanism cannot be</text>
<text x="60" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">claimed new from their combination.</text>
<rect x="60" y="312" width="1480" height="496" rx="18" fill="#FAFBFC" stroke="#D9E1E7" stroke-width="2"/>
<text x="85" y="338" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#7951B2">ENTRY HYPOTHESIS - more starting AT2 cells acquire the intermediate state</text>
<rect x="201.8" y="379.5" width="86.4" height="81.0" rx="17.55" fill="#E986A3" stroke="#20323C" stroke-width="2"/>
<ellipse cx="250.4" cy="422.7" rx="18.900000000000002" ry="16.200000000000003" fill="#8F6DA8" stroke="#20323C" stroke-width="1.5"/>
<ellipse cx="223.4" cy="401.1" rx="5.4" ry="5.4" fill="#FBE7C2" stroke="#FBE7C2" stroke-width="2"/>
<text x="245.0" y="494.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#20323C">Starting AT2 lineage</text>
<polygon points="843.2,420.0 834.3653895656662,451.5016071018607 800.0,464.55 765.6346104343338,451.5016071018607 756.8,420.0 765.6346104343338,388.4983928981393 800.0,375.45 834.3653895656662,388.4983928981393" fill="#EDCD69" stroke="#20323C" stroke-width="2"/>
<ellipse cx="805.4" cy="422.7" rx="18.900000000000002" ry="16.200000000000003" fill="#8F6DA8" stroke="#20323C" stroke-width="1.5"/>
<ellipse cx="778.4" cy="401.1" rx="5.4" ry="5.4" fill="#FBE7C2" stroke="#FBE7C2" stroke-width="2"/>
<text x="800.0" y="494.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#20323C">More state acquisition?</text>
<polygon points="1255.1,438.9 1307.75,429.45 1332.05,407.85 1361.75,401.1 1394.15,421.35 1461.65,436.2 1386.05,444.3 1329.35,441.6" fill="#75B8C8" stroke="#20323C" stroke-width="2"/>
<ellipse cx="1355" cy="422.7" rx="17.55" ry="9.450000000000001" fill="#80699C" stroke="#20323C" stroke-width="1"/>
<text x="1355.0" y="494.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#20323C">Later AT1 output is separate</text>
<line x1="374" y1="420" x2="674" y2="420" stroke="#7951B2" stroke-width="3.5" stroke-dasharray="9,7"/>
<polygon points="674,420 660.4932934647098,426.52448301166845 660.4932934647098,413.47551698833155" fill="#7951B2" stroke="#7951B2" stroke-width="2"/>
<text x="523.0" y="373.0" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#7951B2">SLC34A2 transport</text>
<text x="523.0" y="400.72" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#7951B2">impairment</text>
<line x1="926" y1="420" x2="1228" y2="420" stroke="#7951B2" stroke-width="3.5" stroke-dasharray="9,7"/>
<polygon points="1228,420 1214.49329346471,426.52448301166845 1214.49329346471,413.47551698833155" fill="#7951B2" stroke="#7951B2" stroke-width="2"/>
<text x="1075.0" y="373.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#7951B2">Measure subsequent exit</text>
<text x="1075.0" y="399.4" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#7951B2">independently</text>
<text x="85" y="558" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#BC653D">DELAYED-EXIT RIVAL - more intermediate cells without increased entry</text>
