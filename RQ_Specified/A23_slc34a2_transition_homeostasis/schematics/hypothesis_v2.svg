<ellipse cx="805.4" cy="644.7" rx="18.900000000000002" ry="16.200000000000003" fill="#8F6DA8" stroke="#20323C" stroke-width="1.5"/>
<ellipse cx="778.4" cy="623.1" rx="5.4" ry="5.4" fill="#FBE7C2" stroke="#FBE7C2" stroke-width="2"/>
<text x="800.0" y="716.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#20323C">Longer intermediate residence?</text>
<polygon points="1255.1,660.9 1307.75,651.45 1332.05,629.85 1361.75,623.1 1394.15,643.35 1461.65,658.2 1386.05,666.3 1329.35,663.6" fill="#75B8C8" stroke="#20323C" stroke-width="2"/>
<ellipse cx="1355" cy="644.7" rx="17.55" ry="9.450000000000001" fill="#80699C" stroke="#20323C" stroke-width="1"/>
<text x="1355.0" y="716.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#20323C">Reduced or delayed AT1 output?</text>
