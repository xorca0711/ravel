<polygon points="1228,642 1214.49329346471,648.5244830116685 1214.49329346471,635.4755169883315" fill="#BC653D" stroke="#BC653D" stroke-width="2"/>
<text x="1078.5" y="599.0" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#BC653D">Exit is impaired?</text>
<line x1="849" y1="608" x2="877" y2="584" stroke="#BC653D" stroke-width="3.5" stroke-dasharray="9,7"/>
<polygon points="877,584 870.9910211471243,597.7438049005976 862.4988666266166,587.8362912933387" fill="#BC653D" stroke="#BC653D" stroke-width="2"/>
