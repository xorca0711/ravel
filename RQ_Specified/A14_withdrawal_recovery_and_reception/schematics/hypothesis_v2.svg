<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc"><title id="title">A14</title><desc id="desc">Original hypothesis illustration. Arrows show the labeled proposed comparison, not observed results. Cell counts and shapes are qualitative. Read the full caption and sources.</desc>
<rect x="0" y="0" width="1600" height="1200" rx="0" fill="white" stroke="white" stroke-width="2"/>
<text x="60" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#168F91">A14  /  HYPOTHESIS AND RIVAL</text>
<text x="1540" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="end" fill="#7951B2">CONDITIONAL BIOLOGICAL COMPARISON</text>
<text x="60" y="101.0" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="600" text-anchor="start" fill="#20323C">Does IL-1 history change mature recovery after withdrawal?</text>
<text x="60" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">H1: longer IL-1-beta exposure reduces subsequent lineage-derived mature AT1 recovery after input cessation, with comparable recovery intervals and</text>
<text x="60" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">culture age. H2, assessed separately: fibroblast IL-1 reception modifies that mature-output recovery beyond direct epithelial reception. H2 has no</text>
<text x="60" y="223" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">justified direction yet. The proposed increment concerns post-cessation maturation, not the already published effects of withdrawal or fibroblast</text>
<text x="60" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">pre-exposure on organoid formation.</text>
