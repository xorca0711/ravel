<text x="60" y="844" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#168F91">WHAT THE READOUTS WOULD LET YOU DECIDE</text>
<rect x="60" y="863" width="476" height="162" rx="12" fill="#F5F7FA" stroke="#F5F7FA" stroke-width="2"/>
<text x="80" y="895.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#20323C">Mature recovery</text>
<text x="80" y="933" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">Lineage-linked absolute AT1 yield and a qualified</text>
<text x="80" y="958" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">functional endpoint answer recovery.</text>
<rect x="562" y="863" width="476" height="162" rx="12" fill="#F5F7FA" stroke="#F5F7FA" stroke-width="2"/>
<text x="582" y="895.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#20323C">Residual input is a rival</text>
<text x="582" y="933" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">Measure cessation and track survival; organoid</text>
<text x="582" y="958" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">number alone is insufficient.</text>
<rect x="1064" y="863" width="476" height="162" rx="12" fill="#F5F7FA" stroke="#F5F7FA" stroke-width="2"/>
<text x="1084" y="895.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#20323C">Two separate decisions</text>
<text x="1084" y="933" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">H1 and H2 can differ. The drawing does not predict</text>
<text x="1084" y="958" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">a direction for H2.</text>
<text x="60" y="1059" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#5B6D77">Current evidence: Withdrawal recovery and fibroblast pre-exposure effects already have precedents. The remaining candidate is later mature output.</text>
