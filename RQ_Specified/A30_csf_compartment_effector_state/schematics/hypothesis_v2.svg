<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1330" viewBox="0 0 1680 1330">
<title>A30 | Paired CSF–blood inflammatory RNA programmes</title><desc>Hypothesis illustration. Qualitative proposed comparison, alternatives and conditional extensions; no measured cell counts or experimental results.</desc>
<rect width="1680" height="1330" fill="#FFFFFF"/>
<text x="60" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#247F7B">A30  /  HYPOTHESIS ILLUSTRATION</text>
<text x="60" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="600" fill="#283E49">Does the CSF-associated RNA difference persist within comparable T-cell states?</text>
<text x="60" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#566A74">Paired human samples • donor is the biological unit • association before mechanism</text>
<rect x="60" y="178" width="1560" height="145" rx="14" fill="#EAF5F3" stroke="#C0DDD7" stroke-width="2"/>
<text x="85" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#247F7B">WORKING HYPOTHESIS</text>
<text x="85" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">In paired CSF and blood, the inflammatory RNA programme remains higher in CSF within comparable CD4 T-cell states after</text>
<text x="85" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">accounting for measured activation and composition. Regulatory-associated RNA is evaluated separately, without presuming</text>
<text x="85" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">unchanged regulatory function.</text>
<text x="60" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#247F7B">01  DEFINE THE PAIRED COMPARISON</text>
<rect x="60" y="386" width="975" height="265" rx="14" fill="#F5F9FA" stroke="#DDE7EB" stroke-width="2"/>
<text x="86" y="423" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#283E49">Same donor • paired sampling • putative CD4 identity needs qualification</text>
<rect x="180" y="447" width="190" height="120" rx="14" fill="#FFFFFF" stroke="#DDE7EB" stroke-width="2"/>
<ellipse cx="218" cy="482" rx="13" ry="13" fill="#247F7B"/>
<ellipse cx="220" cy="481" rx="5" ry="6" fill="#FFFFFF" fill-opacity="0.6"/>
<ellipse cx="265" cy="481" rx="13" ry="13" fill="#A7628A"/>
<ellipse cx="267" cy="480" rx="5" ry="6" fill="#FFFFFF" fill-opacity="0.6"/>
<ellipse cx="318" cy="482" rx="13" ry="13" fill="#6D8DA3"/>
<ellipse cx="320" cy="481" rx="5" ry="6" fill="#FFFFFF" fill-opacity="0.6"/>
<ellipse cx="232" cy="527" rx="13" ry="13" fill="#6D8DA3"/>
<ellipse cx="234" cy="526" rx="5" ry="6" fill="#FFFFFF" fill-opacity="0.6"/>
<ellipse cx="290" cy="525" rx="13" ry="13" fill="#247F7B"/>
<ellipse cx="292" cy="524" rx="5" ry="6" fill="#FFFFFF" fill-opacity="0.6"/>
<text x="240" y="598" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#283E49">Blood</text>
<rect x="700" y="447" width="190" height="120" rx="14" fill="#FFFFFF" stroke="#DDE7EB" stroke-width="2"/>
<ellipse cx="738" cy="482" rx="13" ry="13" fill="#247F7B"/>
<ellipse cx="740" cy="481" rx="5" ry="6" fill="#FFFFFF" fill-opacity="0.6"/>
<ellipse cx="785" cy="481" rx="13" ry="13" fill="#A7628A"/>
<ellipse cx="787" cy="480" rx="5" ry="6" fill="#FFFFFF" fill-opacity="0.6"/>
<ellipse cx="838" cy="482" rx="13" ry="13" fill="#6D8DA3"/>
<ellipse cx="840" cy="481" rx="5" ry="6" fill="#FFFFFF" fill-opacity="0.6"/>
<ellipse cx="752" cy="527" rx="13" ry="13" fill="#6D8DA3"/>
<ellipse cx="754" cy="526" rx="5" ry="6" fill="#FFFFFF" fill-opacity="0.6"/>
<ellipse cx="810" cy="525" rx="13" ry="13" fill="#247F7B"/>
<ellipse cx="812" cy="524" rx="5" ry="6" fill="#FFFFFF" fill-opacity="0.6"/>
<text x="760" y="598" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#283E49">CSF</text>
<line x1="386" y1="505" x2="680" y2="505" stroke="#247F7B" stroke-width="3"/>
<polygon points="680,505 668,498 668,512" fill="#247F7B"/>
<text x="423" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#247F7B">paired difference</text>
<text x="410" y="548" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#283E49">CSF minus blood</text>
<text x="88" y="631" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#566A74">Cell symbols are qualitative; colour denotes possible states, not observed counts.</text>
<rect x="1060" y="386" width="560" height="265" rx="14" fill="#FFFFFF" stroke="#DDE7EB" stroke-width="2"/>
<text x="1085" y="423" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#247F7B">MEASURED ENDPOINT</text>
<text x="1085" y="461" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#283E49">Inflammatory RNA programme, within</text>
<text x="1085" y="493" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#283E49">comparable states and measured</text>
<text x="1085" y="525" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#283E49">activation.</text>
<text x="1085" y="568" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">Regulatory RNA is separate. Neither score</text>
<text x="1085" y="599" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">measures secretion or suppressive</text>
<text x="1085" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">function.</text>
<text x="60" y="700" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#247F7B">02  INTERPRET ALTERNATIVES THAT CAN COEXIST</text>
<rect x="60" y="722" width="500" height="193" rx="14" fill="#F5F9FA" stroke="#DDE7EB" stroke-width="2"/>
<text x="84" y="761" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#283E49">Residual activation</text>
<text x="84" y="802" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">Gene-disjoint panels and broad tertiles</text>
<text x="84" y="832" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">do not guarantee balance. A residual RNA</text>
<text x="84" y="862" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">difference is not activation</text>
<text x="84" y="892" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">independence.</text>
<rect x="590" y="722" width="500" height="193" rx="14" fill="#F5F9FA" stroke="#DDE7EB" stroke-width="2"/>
<text x="614" y="761" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#283E49">Trafficking and composition</text>
<text x="614" y="802" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">Different subsets or clones can enter</text>
<text x="614" y="832" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">CSF. Missing state overlap limits the</text>
<text x="614" y="862" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">decomposition; shared TCR does not prove</text>
<text x="614" y="892" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">residency.</text>
<rect x="1120" y="722" width="500" height="193" rx="14" fill="#F5F9FA" stroke="#DDE7EB" stroke-width="2"/>
<text x="1144" y="761" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#283E49">Measurement validity</text>
<text x="1144" y="802" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">Check lineage, depth, null-gene</text>
<text x="1144" y="832" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">background and donor support. Non-</text>
<text x="1144" y="862" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">significance is not equivalence or</text>
<text x="1144" y="892" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">unchanged function.</text>
<text x="60" y="963" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#247F7B">03  EXTEND ONLY AS THE QUESTION REQUIRES</text>
<rect x="60" y="985" width="500" height="200" rx="14" fill="#EAF5F3" stroke="#C0DDD7" stroke-width="2"/>
<text x="84" y="1024" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#283E49">First: qualify the RNA contrast</text>
<text x="84" y="1065" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">Barcode/QC trail, activation balance,</text>
<text x="84" y="1095" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">null calibration and common-state</text>
<text x="84" y="1125" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">support. A new numerical pass needs a</text>
<text x="84" y="1155" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">versioned amendment.</text>
<rect x="590" y="985" width="500" height="200" rx="14" fill="#EAF5F3" stroke="#C0DDD7" stroke-width="2"/>
<text x="614" y="1024" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#283E49">Conditional: phenotype + clones</text>
<text x="614" y="1065" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">Paired protein/TCR can resolve phenotype</text>
<text x="614" y="1095" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">and clonal overlap. Functional claims</text>
<text x="614" y="1125" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">need a suitable functional assay, not</text>
<text x="614" y="1155" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">markers alone.</text>
<rect x="1120" y="985" width="500" height="200" rx="14" fill="#EAF5F3" stroke="#C0DDD7" stroke-width="2"/>
<text x="1144" y="1024" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#283E49">Conditional: perturbation</text>
<text x="1144" y="1065" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">A defined intervention versus control</text>
<text x="1144" y="1095" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">can test an effect. Add rescue or</text>
<text x="1144" y="1125" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">factorial arms only for the intended</text>
<text x="1144" y="1155" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">stronger inference.</text>
<text x="60" y="1233" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#283E49">Persistence → residual association. Attenuation → measured features contribute. Imprecision → unresolved.</text>
<text x="60" y="1282" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#566A74">v2 • 7 October 2026 • Proposed, not scientifically accepted • Assay, timing and precision remain to be qualified</text>
</svg>
