<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1240" viewBox="0 0 1680 1240" role="img" aria-labelledby="title desc"><title id="title">A30</title><desc id="desc">Original hypothesis illustration of a proposed experimental design. Dishes, markers and positions are qualitative and stand for conditions, not for measured values. Read the full caption and sources.</desc>
<rect x="0" y="0" width="1680" height="1240" rx="0" fill="white"/>
<text x="72" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#2E8B86" letter-spacing="1">A30</text>
<text x="118" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#9AA8B0" letter-spacing="2">PROPOSED EXPERIMENTAL DESIGN</text>
<text x="1608" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="end" fill="#9AA8B0" letter-spacing="1">HYPOTHESIS ILLUSTRATION · NOT A RESULT</text>
<line x1="72" y1="66" x2="1608" y2="66" stroke="#E4EAEE" stroke-width="1.4"/>
<text x="72" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="600" text-anchor="start" fill="#33434D">Is the CSF effector elevation a compartment state, or just more activation?</text>
<text x="72" y="156" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#6B7B85">In ten donors the pro-inflammatory arm is higher in CSF than in that donor's own blood, and the regulatory arm is not. But activation is higher in CSF too.</text>
<text x="72" y="183" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#6B7B85">Stratifying on activation defined from genes outside both modules is the comparison that separates them, and it runs on data already in hand.</text>
<text x="72" y="244" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#9AA8B0" letter-spacing="2">SAMPLE STRATA · PAIRED WITHIN DONOR, DONOR AS UNIT (n = 10)</text>
<line x1="72" y1="254" x2="1608" y2="254" stroke="#E4EAEE" stroke-width="1.2"/>
<ellipse cx="264.0" cy="352" rx="40" ry="40" fill="#EAF1F5" stroke="#E4EAEE" stroke-width="1.6"/>
<ellipse cx="264.0" cy="352" rx="32" ry="32" fill="white" stroke="none" stroke-width="0"/>
<ellipse cx="251.0" cy="343" rx="5.2" ry="5.2" fill="#92A1AA" stroke="#92A1AA" stroke-width="0"/>
<ellipse cx="275.0" cy="340" rx="5.2" ry="5.2" fill="#92A1AA" stroke="#92A1AA" stroke-width="0"/>
<ellipse cx="280.0" cy="360" rx="5.2" ry="5.2" fill="#92A1AA" stroke="#92A1AA" stroke-width="0"/>
<ellipse cx="255.0" cy="364" rx="5.2" ry="5.2" fill="#92A1AA" stroke="#92A1AA" stroke-width="0"/>
<text x="264.0" y="312" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#92A1AA" letter-spacing="1">STRATUM 1</text>
<text x="264.0" y="420" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#33434D">Blood, low activation</text>
<text x="98.0" y="446" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">Reference. Activation score from genes</text>
<text x="98.0" y="466" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">disjoint from both modules.</text>
<line x1="456.0" y1="290" x2="456.0" y2="486" stroke="#E4EAEE" stroke-width="1.0"/>
<ellipse cx="648.0" cy="352" rx="40" ry="40" fill="#EAF1F5" stroke="#E4EAEE" stroke-width="1.6"/>
<ellipse cx="648.0" cy="352" rx="32" ry="32" fill="white" stroke="none" stroke-width="0"/>
<ellipse cx="635.0" cy="343" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="659.0" cy="340" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="664.0" cy="360" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="639.0" cy="364" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="648.0" cy="351" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<text x="648.0" y="312" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C86B0" letter-spacing="1">STRATUM 2</text>
<text x="648.0" y="420" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#33434D">CSF, low activation</text>
<text x="482.0" y="446" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">The decisive cell. Compartment differs,</text>
<text x="482.0" y="466" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">activation matched.</text>
<line x1="840.0" y1="290" x2="840.0" y2="486" stroke="#E4EAEE" stroke-width="1.0"/>
<ellipse cx="1032.0" cy="352" rx="40" ry="40" fill="#EAF1F5" stroke="#E4EAEE" stroke-width="1.6"/>
<ellipse cx="1032.0" cy="352" rx="32" ry="32" fill="white" stroke="none" stroke-width="0"/>
<ellipse cx="1019.0" cy="343" rx="5.2" ry="5.2" fill="#92A1AA" stroke="#92A1AA" stroke-width="0"/>
<ellipse cx="1043.0" cy="340" rx="5.2" ry="5.2" fill="#92A1AA" stroke="#92A1AA" stroke-width="0"/>
<ellipse cx="1048.0" cy="360" rx="5.2" ry="5.2" fill="#92A1AA" stroke="#92A1AA" stroke-width="0"/>
<ellipse cx="1023.0" cy="364" rx="5.2" ry="5.2" fill="#92A1AA" stroke="#92A1AA" stroke-width="0"/>
<ellipse cx="1032.0" cy="351" rx="5.2" ry="5.2" fill="#92A1AA" stroke="#92A1AA" stroke-width="0"/>
<text x="1032.0" y="312" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#92A1AA" letter-spacing="1">STRATUM 3</text>
<text x="1032.0" y="420" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#33434D">Blood, high activation</text>
<text x="866.0" y="446" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">Activation differs, compartment held.</text>
<line x1="1224.0" y1="290" x2="1224.0" y2="486" stroke="#E4EAEE" stroke-width="1.0"/>
<ellipse cx="1416.0" cy="352" rx="40" ry="40" fill="#EAF1F5" stroke="#E4EAEE" stroke-width="1.6"/>
<ellipse cx="1416.0" cy="352" rx="32" ry="32" fill="white" stroke="none" stroke-width="0"/>
<ellipse cx="1403.0" cy="343" rx="5.2" ry="5.2" fill="#C98A5B" stroke="#C98A5B" stroke-width="0"/>
<ellipse cx="1427.0" cy="340" rx="5.2" ry="5.2" fill="#C98A5B" stroke="#C98A5B" stroke-width="0"/>
<ellipse cx="1432.0" cy="360" rx="5.2" ry="5.2" fill="#C98A5B" stroke="#C98A5B" stroke-width="0"/>
<ellipse cx="1407.0" cy="364" rx="5.2" ry="5.2" fill="#C98A5B" stroke="#C98A5B" stroke-width="0"/>
<ellipse cx="1416.0" cy="351" rx="5.2" ry="5.2" fill="#C98A5B" stroke="#C98A5B" stroke-width="0"/>
<ellipse cx="1395.0" cy="354" rx="5.2" ry="5.2" fill="#C98A5B" stroke="#C98A5B" stroke-width="0"/>
<text x="1416.0" y="312" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#C98A5B" letter-spacing="1">STRATUM 4</text>
<text x="1416.0" y="420" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#33434D">CSF, high activation</text>
<text x="1250.0" y="446" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">Where compartment and activation coincide,</text>
<text x="1250.0" y="466" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">as in the unstratified contrast.</text>
<text x="72" y="510" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#9AA8B0" letter-spacing="2">MEASURED ON EVERY ARM</text>
<line x1="72" y1="520" x2="1608" y2="520" stroke="#E4EAEE" stroke-width="1.2"/>
<rect x="72.0" y="554" width="370.5" height="112" rx="12" fill="#FBFCFD" stroke="#E4EAEE" stroke-width="1.2"/>
<rect x="72.0" y="554" width="4" height="112" rx="0" fill="#C97F63"/>
<text x="92.0" y="586" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#33434D">Pro-inflammatory arm</text>
<text x="92.0" y="612" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">Donor-level mean score against a</text>
<text x="92.0" y="632" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">matched-size random-set null, 1,000 draws,</text>
<text x="92.0" y="652" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">reported per stratum.</text>
<rect x="460.5" y="554" width="370.5" height="112" rx="12" fill="#FBFCFD" stroke="#E4EAEE" stroke-width="1.2"/>
<rect x="460.5" y="554" width="4" height="112" rx="0" fill="#5B9B86"/>
<text x="480.5" y="586" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#33434D">Pro-regulatory arm</text>
<text x="480.5" y="612" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">Always reported alongside on the same null,</text>
<text x="480.5" y="632" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">whichever way the pro-inflammatory arm</text>
<text x="480.5" y="652" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">falls.</text>
<rect x="849.0" y="554" width="370.5" height="112" rx="12" fill="#FBFCFD" stroke="#E4EAEE" stroke-width="1.2"/>
<rect x="849.0" y="554" width="4" height="112" rx="0" fill="#C98A5B"/>
<text x="869.0" y="586" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#33434D">Composition vs within-state</text>
<text x="869.0" y="612" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">The paired difference split into a mixture</text>
<text x="869.0" y="632" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">term and a within-state term, as done for</text>
<text x="869.0" y="652" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">the mouse glucose effect.</text>
<rect x="1237.5" y="554" width="370.5" height="112" rx="12" fill="#FBFCFD" stroke="#E4EAEE" stroke-width="1.2"/>
<rect x="1237.5" y="554" width="4" height="112" rx="0" fill="#92A1AA"/>
<text x="1257.5" y="586" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#33434D">Not available here</text>
<text x="1257.5" y="612" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">Shared-clone TCR comparison across</text>
<text x="1257.5" y="632" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">compartments. Without it, residency cannot</text>
<text x="1257.5" y="652" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">be excluded by any analysis.</text>
<text x="72" y="704" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#9AA8B0" letter-spacing="2">WHAT EACH OUTCOME WOULD MEAN</text>
<line x1="72" y1="714" x2="1608" y2="714" stroke="#E4EAEE" stroke-width="1.2"/>
<text x="92" y="754" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#9AA8B0" letter-spacing="1">IF THE READOUT SHOWS</text>
<text x="704" y="754" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#9AA8B0" letter-spacing="1">THEN</text>
<rect x="72" y="766" width="1536" height="58" rx="8" fill="#FBFCFD"/>
<rect x="72" y="775" width="4" height="40" rx="2" fill="#4C86B0"/>
<text x="92" y="790" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#33434D">Stratum 2 still exceeds stratum 1 on the pro-inflammatory arm, with the</text>
<text x="92" y="809" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#33434D">pro-regulatory arm flat.</text>
<text x="704" y="790" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">A compartment-associated effector state not reducible to activation. The arm asymmetry becomes a reportable</text>
<text x="704" y="809" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">contrast against the mouse result, still short of causation.</text>
<rect x="72" y="833" width="4" height="34" rx="2" fill="#C98A5B"/>
<text x="92" y="848" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#33434D">The elevation collapses once activation is matched.</text>
<text x="704" y="848" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">Activation explains it. The result is downgraded to an activation correlate and the arm-asymmetry claim is</text>
<text x="704" y="867" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">withdrawn.</text>
<rect x="72" y="876" width="1536" height="52" rx="8" fill="#FBFCFD"/>
<rect x="72" y="885" width="4" height="34" rx="2" fill="#C98A5B"/>
<text x="92" y="900" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#33434D">The composition term carries the paired difference.</text>
<text x="704" y="900" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">A mixture shift, not a within-cell state — consistent with the described CSF-enriched Th17-lineage subset.</text>
<rect x="72" y="937" width="4" height="34" rx="2" fill="#92A1AA"/>
<text x="92" y="952" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#33434D">Ten donors cannot separate the strata.</text>
<text x="704" y="952" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">Precision-limited and reported as such. A null here is never evidence of absence; do not relax the stratification</text>
<text x="704" y="971" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">to recover significance.</text>
<line x1="72" y1="1126" x2="1608" y2="1126" stroke="#E4EAEE" stroke-width="1.2"/>
<text x="72" y="1148" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">Dishes and markers stand for conditions and cells, not for measured values; no count, size or position here is data.</text>
<text x="72" y="1170" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">The design is proposed and unexecuted. Nothing here certifies a mechanism, a protein measurement or laboratory access.</text>
