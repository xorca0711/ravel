<text x="1072.5" y="600" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#BC653D">same endpoint, different cause</text>
<text x="60" y="844" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#168F91">WHAT THE READOUTS WOULD LET YOU DECIDE</text>
<rect x="60" y="863" width="476" height="162" rx="12" fill="#F5F7FA" stroke="#F5F7FA" stroke-width="2"/>
<text x="80" y="895.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#20323C">Published pathway</text>
<text x="80" y="933" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">Integrin-mediated latent TGF-beta activation is</text>
<text x="80" y="958" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">already known.</text>
<rect x="562" y="863" width="476" height="162" rx="12" fill="#F5F7FA" stroke="#F5F7FA" stroke-width="2"/>
<text x="582" y="895.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#20323C">Separate active and total</text>
<text x="582" y="933" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">Total ligand and Itgb6 RNA cannot establish</text>
<text x="582" y="958" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">activation in this source context.</text>
<rect x="1064" y="863" width="476" height="162" rx="12" fill="#F5F7FA" stroke="#F5F7FA" stroke-width="2"/>
<text x="1084" y="895.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#20323C">Nominate the endpoint</text>
<text x="1084" y="933" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">Specify the actual fibroblast function before</text>
<text x="1084" y="958" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">treating a RNA score as a decisive assay.</text>
<text x="60" y="1059" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#5B6D77">Current evidence: The motivating Itgb6-associated contrast does not measure active ligand or demonstrate mediation.</text>
