<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1240" viewBox="0 0 1680 1240" role="img" aria-labelledby="title desc"><title id="title">A29</title><desc id="desc">Original hypothesis illustration of a proposed experimental design. Dishes, markers and positions are qualitative and stand for conditions, not for measured values. Read the full caption and sources.</desc>
<rect x="0" y="0" width="1680" height="1240" rx="0" fill="white"/>
<text x="72" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#2E8B86" letter-spacing="1">A29</text>
<text x="118" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#9AA8B0" letter-spacing="2">PROPOSED EXPERIMENTAL DESIGN</text>
<text x="1608" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="end" fill="#9AA8B0" letter-spacing="1">HYPOTHESIS ILLUSTRATION · NOT A RESULT</text>
<line x1="72" y1="66" x2="1608" y2="66" stroke="#E4EAEE" stroke-width="1.4"/>
<text x="72" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="600" text-anchor="start" fill="#33434D">Which of three mechanisms raises Th17 effector output when PGAM is restricted?</text>
<text x="72" y="156" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#6B7B85">PGAM sits two steps upstream of phosphoenolpyruvate, which is a published inhibitor of the Th17 programme through JunB. Blocking PGAM should lower PEP and</text>
<text x="72" y="183" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#6B7B85">release that brake — but the source reports PEP label unchanged, and proposes stress instead. One culture experiment separates PEP, demand relief and</text>
<text x="72" y="210" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#6B7B85">stress.</text>
<text x="72" y="271" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#9AA8B0" letter-spacing="2">CULTURE ARMS · TH17N POLARISATION, MOUSE AS UNIT</text>
<line x1="72" y1="281" x2="1608" y2="281" stroke="#E4EAEE" stroke-width="1.2"/>
<ellipse cx="264.0" cy="379" rx="40" ry="40" fill="#EAF1F5" stroke="#E4EAEE" stroke-width="1.6"/>
<ellipse cx="264.0" cy="379" rx="32" ry="32" fill="white" stroke="none" stroke-width="0"/>
<ellipse cx="251.0" cy="370" rx="5.2" ry="5.2" fill="#92A1AA" stroke="#92A1AA" stroke-width="0"/>
<ellipse cx="275.0" cy="367" rx="5.2" ry="5.2" fill="#92A1AA" stroke="#92A1AA" stroke-width="0"/>
<ellipse cx="280.0" cy="387" rx="5.2" ry="5.2" fill="#92A1AA" stroke="#92A1AA" stroke-width="0"/>
<ellipse cx="255.0" cy="391" rx="5.2" ry="5.2" fill="#92A1AA" stroke="#92A1AA" stroke-width="0"/>
<ellipse cx="264.0" cy="378" rx="5.2" ry="5.2" fill="#92A1AA" stroke="#92A1AA" stroke-width="0"/>
<text x="264.0" y="339" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#92A1AA" letter-spacing="1">ARM 1</text>
<text x="264.0" y="447" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#33434D">Vehicle</text>
<text x="98.0" y="473" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">Solvent-matched reference.</text>
<line x1="456.0" y1="317" x2="456.0" y2="513" stroke="#E4EAEE" stroke-width="1.0"/>
<ellipse cx="648.0" cy="379" rx="40" ry="40" fill="#EAF1F5" stroke="#E4EAEE" stroke-width="1.6"/>
<ellipse cx="648.0" cy="379" rx="32" ry="32" fill="white" stroke="none" stroke-width="0"/>
<ellipse cx="635.0" cy="370" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="659.0" cy="367" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="664.0" cy="387" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="639.0" cy="391" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="648.0" cy="378" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="627.0" cy="381" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<text x="648.0" y="339" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C86B0" letter-spacing="1">ARM 2</text>
<text x="648.0" y="447" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#33434D">PGAM restricted</text>
<text x="482.0" y="473" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">EGCG, plus titrated Pgam1 knockdown as the</text>
<text x="482.0" y="493" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">specificity control.</text>
<line x1="840.0" y1="317" x2="840.0" y2="513" stroke="#E4EAEE" stroke-width="1.0"/>
<ellipse cx="1032.0" cy="379" rx="40" ry="40" fill="#EAF1F5" stroke="#E4EAEE" stroke-width="1.6"/>
<ellipse cx="1032.0" cy="379" rx="32" ry="32" fill="white" stroke="none" stroke-width="0"/>
<ellipse cx="1019.0" cy="370" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="1043.0" cy="367" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="1048.0" cy="387" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="1023.0" cy="391" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="1032.0" cy="378" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<text x="1032.0" y="339" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C86B0" letter-spacing="1">ARM 3</text>
<text x="1032.0" y="447" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#33434D">PGAM restricted + PEP</text>
<text x="866.0" y="473" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">PEP supplementation. The rescue arm that</text>
<text x="866.0" y="493" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">isolates the metabolite route.</text>
<line x1="1224.0" y1="317" x2="1224.0" y2="513" stroke="#E4EAEE" stroke-width="1.0"/>
<ellipse cx="1416.0" cy="379" rx="40" ry="40" fill="#EAF1F5" stroke="#E4EAEE" stroke-width="1.6"/>
<ellipse cx="1416.0" cy="379" rx="32" ry="32" fill="white" stroke="none" stroke-width="0"/>
<ellipse cx="1403.0" cy="370" rx="5.2" ry="5.2" fill="#C98A5B" stroke="#C98A5B" stroke-width="0"/>
<ellipse cx="1427.0" cy="367" rx="5.2" ry="5.2" fill="#C98A5B" stroke="#C98A5B" stroke-width="0"/>
<ellipse cx="1432.0" cy="387" rx="5.2" ry="5.2" fill="#C98A5B" stroke="#C98A5B" stroke-width="0"/>
<ellipse cx="1407.0" cy="391" rx="5.2" ry="5.2" fill="#C98A5B" stroke="#C98A5B" stroke-width="0"/>
<text x="1416.0" y="339" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#C98A5B" letter-spacing="1">ARM 4</text>
<text x="1416.0" y="447" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#33434D">Growth slowed, PGAM intact</text>
<text x="1250.0" y="473" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">mTORC1 inhibition or serine restriction.</text>
<text x="1250.0" y="493" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">Demand relief without PGAM.</text>
<text x="72" y="537" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#9AA8B0" letter-spacing="2">MEASURED ON EVERY ARM</text>
<line x1="72" y1="547" x2="1608" y2="547" stroke="#E4EAEE" stroke-width="1.2"/>
<rect x="72.0" y="581" width="370.5" height="112" rx="12" fill="#FBFCFD" stroke="#E4EAEE" stroke-width="1.2"/>
<rect x="72.0" y="581" width="4" height="112" rx="0" fill="#4C86B0"/>
<text x="92.0" y="613" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#33434D">PEP, 2PG, 3PG pools</text>
<text x="92.0" y="639" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">Targeted metabolomics, absolute pools. A</text>
<text x="92.0" y="659" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">15-minute label ratio cannot tell a steady</text>
<text x="92.0" y="679" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">pool from a falling one.</text>
<rect x="460.5" y="581" width="370.5" height="112" rx="12" fill="#FBFCFD" stroke="#E4EAEE" stroke-width="1.2"/>
<rect x="460.5" y="581" width="4" height="112" rx="0" fill="#C97F63"/>
<text x="480.5" y="613" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#33434D">IL-17A protein</text>
<text x="480.5" y="639" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">Per cell, so output is not inferred from</text>
<text x="480.5" y="659" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">transcript abundance or from a bulk library</text>
<text x="480.5" y="679" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">average.</text>
<rect x="849.0" y="581" width="370.5" height="112" rx="12" fill="#FBFCFD" stroke="#E4EAEE" stroke-width="1.2"/>
<rect x="849.0" y="581" width="4" height="112" rx="0" fill="#C98A5B"/>
<text x="869.0" y="613" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#33434D">p-eIF2α and ATF4 protein</text>
<text x="869.0" y="639" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">The stress route at the level it is</text>
<text x="869.0" y="659" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">actually set, rather than through its</text>
<text x="869.0" y="679" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">downstream target transcripts.</text>
<rect x="1237.5" y="581" width="370.5" height="112" rx="12" fill="#FBFCFD" stroke="#E4EAEE" stroke-width="1.2"/>
<rect x="1237.5" y="581" width="4" height="112" rx="0" fill="#C98A5B"/>
<text x="1257.5" y="613" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#33434D">Division + RNA content</text>
<text x="1257.5" y="639" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">Dye dilution and per-cell RNA or ribosome</text>
<text x="1257.5" y="659" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">content, so dilution and compositional</text>
<text x="1257.5" y="679" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">effects are measured, not argued.</text>
<text x="72" y="731" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#9AA8B0" letter-spacing="2">WHAT EACH OUTCOME WOULD MEAN</text>
<line x1="72" y1="741" x2="1608" y2="741" stroke="#E4EAEE" stroke-width="1.2"/>
<text x="92" y="781" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#9AA8B0" letter-spacing="1">IF THE READOUT SHOWS</text>
<text x="704" y="781" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#9AA8B0" letter-spacing="1">THEN</text>
<rect x="72" y="793" width="1536" height="58" rx="8" fill="#FBFCFD"/>
<rect x="72" y="802" width="4" height="40" rx="2" fill="#4C86B0"/>
<text x="92" y="817" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#33434D">Arm 2 lowers the PEP pool, and arm 3 abolishes the IL-17 increase.</text>
<text x="704" y="817" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">The metabolite route. PGAM restriction acts by releasing PEP inhibition of JunB/BATF/IRF4; the stress premise is</text>
<text x="704" y="836" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">unnecessary and should be withdrawn as the stated mechanism.</text>
<rect x="72" y="860" width="4" height="34" rx="2" fill="#C98A5B"/>
<text x="92" y="875" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#33434D">The PEP pool is genuinely unchanged in arm 2.</text>
<text x="704" y="875" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">The metabolite route is eliminated on the authors' own measurement extended to pools. Demand relief and the</text>
<text x="704" y="894" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">serine branch remain.</text>
<rect x="72" y="903" width="1536" height="52" rx="8" fill="#FBFCFD"/>
<rect x="72" y="912" width="4" height="34" rx="2" fill="#4C86B0"/>
<text x="92" y="927" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#33434D">Arm 4 reproduces the IL-17 increase with p-eIF2α flat.</text>
<text x="704" y="927" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">Demand relief. Effector output tracks growth reduction however it is produced, and PGAM is not special.</text>
<rect x="72" y="964" width="4" height="34" rx="2" fill="#C98A5B"/>
<text x="92" y="979" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#33434D">p-eIF2α and ATF4 protein rise in arm 2 despite falling target</text>
<text x="92" y="998" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#33434D">transcripts.</text>
<text x="704" y="979" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">Transcript modules mis-read the response. The stress premise survives at protein level and the E3 conclusion is</text>
<text x="704" y="998" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">transcript-limited.</text>
<rect x="72" y="1007" width="1536" height="52" rx="8" fill="#FBFCFD"/>
<rect x="72" y="1016" width="4" height="34" rx="2" fill="#92A1AA"/>
<text x="92" y="1031" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#33434D">The IL-17 increase disappears once per-cell RNA content is accounted for.</text>
<text x="704" y="1031" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">Compositional. The measured effector gain does not support increased output per cell.</text>
<line x1="72" y1="1126" x2="1608" y2="1126" stroke="#E4EAEE" stroke-width="1.2"/>
<text x="72" y="1148" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">Dishes and markers stand for conditions and cells, not for measured values; no count, size or position here is data.</text>
<text x="72" y="1170" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">The design is proposed and unexecuted. Nothing here certifies a mechanism, a protein measurement or laboratory access.</text>
