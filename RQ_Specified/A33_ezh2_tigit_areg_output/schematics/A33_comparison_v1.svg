<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660">
<title>A33 hypothesis illustration</title>
<desc>Under a common, demonstrably responsive activation context, Ezh2-deficient murine Tregs have a smaller TIGIT-engagement-minus-control AREG release response than matched genetic controls. This is an output-response hypothesis; it does not assert PRDM1 mediation or tissue repair.</desc>
<rect width="1280" height="660" fill="#f5f7f5"/>
<text x="36" y="42" font-family="Arial, sans-serif" font-size="17" fill="#176b77">A33  /  PROPOSED QUESTION</text>
<text x="36" y="87" font-family="Arial, sans-serif" font-size="27" fill="#20383d">Does Ezh2 loss alter the AREG response to TIGIT engagement in activated Tregs?</text>
<rect x="36" y="180" width="280" height="292" rx="12" fill="white" stroke="#9fb9b3"/>
<ellipse cx="69" cy="215" rx="15" ry="15" fill="#d5e8df" stroke="#176b77"/>
<text x="98" y="221" font-family="Arial, sans-serif" font-size="20" fill="#176b77">1</text>
<text x="54" y="265" font-family="Arial, sans-serif" font-size="21" fill="#20383d">Matched Tregs</text>
<text x="54" y="325" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Ezh2 loss</text>
<text x="54" y="364" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Actual genetic control</text>
<text x="54" y="403" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Common activation</text>
<line x1="318" y1="320" x2="340" y2="320" stroke="#769a91" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="346" y="180" width="280" height="292" rx="12" fill="white" stroke="#9fb9b3"/>
<ellipse cx="379" cy="215" rx="15" ry="15" fill="#d5e8df" stroke="#176b77"/>
<text x="408" y="221" font-family="Arial, sans-serif" font-size="20" fill="#176b77">2</text>
<text x="364" y="265" font-family="Arial, sans-serif" font-size="21" fill="#20383d">TIGIT challenge</text>
<text x="364" y="325" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Engagement / control</text>
<text x="364" y="364" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Paired aliquots</text>
<text x="364" y="403" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Responsive assay</text>
<line x1="628" y1="320" x2="650" y2="320" stroke="#769a91" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="656" y="180" width="280" height="292" rx="12" fill="white" stroke="#9fb9b3"/>
<ellipse cx="689" cy="215" rx="15" ry="15" fill="#d5e8df" stroke="#176b77"/>
<text x="718" y="221" font-family="Arial, sans-serif" font-size="20" fill="#176b77">3</text>
<text x="674" y="265" font-family="Arial, sans-serif" font-size="21" fill="#20383d">Separate readouts</text>
<text x="674" y="325" font-family="Arial, sans-serif" font-size="18" fill="#20383d">AREG release</text>
<text x="674" y="364" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Viable recovery</text>
<text x="674" y="403" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Receptor protein</text>
