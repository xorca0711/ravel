<text x="984" y="325" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Output deficit?</text>
<text x="984" y="364" font-family="Arial, sans-serif" font-size="18" fill="#20383d">General fitness loss?</text>
<text x="984" y="403" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Response preserved?</text>
<text x="36" y="525" font-family="Arial, sans-serif" font-size="21" fill="#20383d">Hypothesis illustration • proposed comparisons, no experimental results</text>
<text x="36" y="563" font-family="Arial, sans-serif" font-size="19" fill="#20383d">Biological unit: independent mouse / preparation; aliquots and wells are nested.</text>
