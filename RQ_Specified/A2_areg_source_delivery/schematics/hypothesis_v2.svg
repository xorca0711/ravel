<text x="60" y="1059" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#5B6D77">Current evidence: The source analyses establish neither an Areg decrement nor a delivery mechanism. EGF and preparation context remain relevant.</text>
