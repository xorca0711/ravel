<text x="1540" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="end" fill="#BC653D">SPECIFICATION GAP REMAINS</text>
<text x="60" y="101.0" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="600" text-anchor="start" fill="#20323C">Does AREG delivery change what fibroblasts actually receive?</text>
<text x="60" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">Epithelial AREG delivery can change the effective ligand reaching fibroblasts and thereby their response, even when epithelial AREG RNA or source-cell</text>
<text x="60" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">abundance is similar. The biological contrast is delivery through effective availability versus a recipient-context effect. The source/presentation</text>
<text x="60" y="223" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">comparison and downstream fibroblast function remain unnominated, so this is a developing hypothesis, not a specified wet experiment.</text>
