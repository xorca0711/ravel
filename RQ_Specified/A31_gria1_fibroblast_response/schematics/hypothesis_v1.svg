<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010">
<title>A31: GRIA1-dependent acute glutamate response in adult alveolar fibroblasts</title>
<desc>Hypothesis illustration. Qualitative proposed comparison; RNA evidence does not establish receptor function. Matched GRIA1 perturbation and control with donor-level biological units; repeated cultures are nested.</desc>
<rect width="1200" height="1010" fill="#f7f8f5"/>
<text x="36" y="34" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#49646d">A31  /  PROPOSED FUNCTIONAL QUESTION</text>
<text x="36" y="75" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1d3039">Does GRIA1 contribute to acute glutamate responsiveness</text>
<text x="36" y="113" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1d3039">in adult human alveolar fibroblasts?</text>
<text x="36" y="152" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#586e76">Hypothesis illustration • planned comparisons • no functional result is depicted</text>
<rect x="36" y="178" width="1128" height="106" rx="12" fill="#eaf0f8" stroke="#ccd6d8"/>
<text x="56" y="210" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#1d3039">Existing evidence: candidate RNA availability</text>
<text x="56" y="243" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">Lung fibroblast expression transports across qualified donor and assay contexts.</text>
<text x="56" y="269" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">Joint SCN7A / GRIA1 detection is assay-sensitive; receptor function remains unmeasured.</text>
<line x1="600" y1="284" x2="600" y2="308" stroke="#6b818b" stroke-width="2"/>
<polygon points="594,307 606,307 600,316" fill="#6b818b"/>
<rect x="290" y="316" width="620" height="137" rx="12" fill="#e9f2ec" stroke="#ccd6d8"/>
<text x="310" y="348" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#1d3039">Qualify before a comparative experiment</text>
<text x="310" y="381" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">Independent adult fibroblast identity and donor / culture IDs</text>
<text x="310" y="407" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">Receptor availability, target engagement and calibrated response</text>
<text x="310" y="433" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">Assay, timing, meaningful effect and precision remain unresolved.</text>
<line x1="480" y1="453" x2="290" y2="485" stroke="#6b818b" stroke-width="2"/>
<polygon points="284,484 296,484 290,493" fill="#6b818b"/>
<line x1="720" y1="453" x2="910" y2="485" stroke="#6b818b" stroke-width="2"/>
<polygon points="904,484 916,484 910,493" fill="#6b818b"/>
<rect x="66" y="493" width="464" height="135" rx="12" fill="#ffffff" stroke="#ccd6d8"/>
<text x="86" y="525" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#1d3039">Matched control</text>
<text x="86" y="558" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">Same starting identity, viable amount and exposure</text>
<text x="86" y="584" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">Measure challenge-minus-vehicle response</text>
<text x="86" y="610" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">Cells and wells remain nested within preparations.</text>
<rect x="670" y="493" width="464" height="135" rx="12" fill="#ffffff" stroke="#ccd6d8"/>
<text x="690" y="525" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#1d3039">Qualified GRIA1 perturbation</text>
<text x="690" y="558" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">Same glutamate challenge and primary readout</text>
<text x="690" y="584" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">Record engagement, identity and viable amount</text>
<text x="690" y="610" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">Donor is the unit; repeated cultures are nested.</text>
<text x="36" y="664" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1d3039">Working hypothesis</text>
<text x="36" y="694" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">Independently identified adult human alveolar fibroblasts exhibit an acute glutamate-evoked response with a</text>
<text x="36" y="720" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">GRIA1-dependent component: qualified GRIA1 perturbation reduces the challenge-minus-vehicle response relative to matched</text>
<text x="36" y="746" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">control preparations under the same exposure.</text>
<rect x="36" y="781" width="355" height="145" rx="12" fill="#e9f2ec" stroke="#ccd6d8"/>
<text x="56" y="813" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#1d3039">Response + qualified effect</text>
<text x="56" y="846" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">Supports a GRIA1 contribution</text>
<text x="56" y="872" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">in the tested preparation.</text>
<text x="56" y="898" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">Does not establish repair.</text>
<rect x="423" y="781" width="354" height="145" rx="12" fill="#f6efe1" stroke="#ccd6d8"/>
<text x="443" y="813" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#1d3039">No resolved dependence</text>
<text x="443" y="846" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">Nonresponse or null contrast:</text>
<text x="443" y="872" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">interpret assay limits and precision;</text>
<text x="443" y="898" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">do not infer universal absence.</text>
<rect x="809" y="781" width="355" height="145" rx="12" fill="#f3e8e5" stroke="#ccd6d8"/>
<text x="829" y="813" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#1d3039">Identity / viability changes</text>
<text x="829" y="846" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">Perturbation effect is ambiguous.</text>
<text x="829" y="872" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">Other receptors and neural mixture</text>
<text x="829" y="898" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1d3039">remain relevant alternatives.</text>
<text x="36" y="958" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#586e76">SCN7A is context, not a mandatory co-positive gate. No sensory-cell, neuronal or causal repair claim.</text>
<a href="https://github.com/xorca0711/ravel/blob/53911171cac9f184d1aa3f2a4b3a7754768dfd84/analysis/research/runs/nb4_p09_expression_specificity_v1_20261007/receipt.json">
<text x="36" y="988" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#22627c">Source: frozen Nb4-P09 expression run • interpretation and experimental qualification remain separate</text>
</a>
</svg>
