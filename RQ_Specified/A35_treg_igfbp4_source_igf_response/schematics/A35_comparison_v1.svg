<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660">
<title>A35 hypothesis illustration</title>
<desc>The Igfbp4 RNA excess in Ezh2-deficient Tregs may produce intact Treg-derived IGFBP4 that changes native-IGF receptor response. Source and intact-protein validation precede that perturbation question; neither the direction of the signaling effect nor benefit from IGFBP4 reduction is established by RNA.</desc>
<rect width="1280" height="660" fill="#f5f7f5"/>
<text x="36" y="42" font-family="Arial, sans-serif" font-size="17" fill="#176b77">A35  /  PROPOSED QUESTION</text>
<text x="36" y="87" font-family="Arial, sans-serif" font-size="27" fill="#20383d">Does the Ezh2-associated Igfbp4 RNA difference yield intact Treg-derived protein</text>
<text x="36" y="121" font-family="Arial, sans-serif" font-size="27" fill="#20383d">that modulates native-IGF response?</text>
<rect x="36" y="180" width="280" height="292" rx="12" fill="white" stroke="#9fb9b3"/>
<ellipse cx="69" cy="215" rx="15" ry="15" fill="#d5e8df" stroke="#176b77"/>
<text x="98" y="221" font-family="Arial, sans-serif" font-size="20" fill="#176b77">1</text>
<text x="54" y="265" font-family="Arial, sans-serif" font-size="21" fill="#20383d">Source question</text>
<text x="54" y="325" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Lineage-identified Tregs</text>
<text x="54" y="364" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Ezh2 loss / control</text>
<text x="54" y="403" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Medium / purity controls</text>
<line x1="318" y1="320" x2="340" y2="320" stroke="#769a91" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="346" y="180" width="280" height="292" rx="12" fill="white" stroke="#9fb9b3"/>
<ellipse cx="379" cy="215" rx="15" ry="15" fill="#d5e8df" stroke="#176b77"/>
<text x="408" y="221" font-family="Arial, sans-serif" font-size="20" fill="#176b77">2</text>
<text x="364" y="265" font-family="Arial, sans-serif" font-size="21" fill="#20383d">Molecular distinction</text>
<text x="364" y="325" font-family="Arial, sans-serif" font-size="18" fill="#20383d">RNA</text>
<text x="364" y="364" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Intact IGFBP4 protein</text>
<text x="364" y="403" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Fragments / carryover</text>
<line x1="628" y1="320" x2="650" y2="320" stroke="#769a91" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="656" y="180" width="280" height="292" rx="12" fill="white" stroke="#9fb9b3"/>
<ellipse cx="689" cy="215" rx="15" ry="15" fill="#d5e8df" stroke="#176b77"/>
<text x="718" y="221" font-family="Arial, sans-serif" font-size="20" fill="#176b77">3</text>
<text x="674" y="265" font-family="Arial, sans-serif" font-size="21" fill="#20383d">Conditional test</text>
<text x="674" y="325" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Native IGF response</text>
<text x="674" y="364" font-family="Arial, sans-serif" font-size="18" fill="#20383d">IGFBP4 reduction / control</text>
<text x="674" y="403" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Defined IL-2 exposure</text>
<line x1="938" y1="320" x2="960" y2="320" stroke="#769a91" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="966" y="180" width="280" height="292" rx="12" fill="white" stroke="#9fb9b3"/>
<ellipse cx="999" cy="215" rx="15" ry="15" fill="#d5e8df" stroke="#176b77"/>
<text x="1028" y="221" font-family="Arial, sans-serif" font-size="20" fill="#176b77">4</text>
<text x="984" y="265" font-family="Arial, sans-serif" font-size="21" fill="#20383d">Separate conclusions</text>
<text x="984" y="325" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Source established?</text>
<text x="984" y="364" font-family="Arial, sans-serif" font-size="18" fill="#20383d">IGF response altered?</text>
<text x="984" y="403" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Function still separate</text>
<text x="36" y="525" font-family="Arial, sans-serif" font-size="21" fill="#20383d">Hypothesis illustration • proposed comparisons, no experimental results</text>
<text x="36" y="563" font-family="Arial, sans-serif" font-size="19" fill="#20383d">Biological unit: independent mouse / preparation; aliquots and wells are nested.</text>
<text x="36" y="600" font-family="Arial, sans-serif" font-size="19" fill="#20383d">Model, timing and precision remain unspecified. RNA does not establish target function.</text>
</svg>
