<text x="80" y="895.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#20323C">First missing link</text>
<text x="80" y="933" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">Identify a supported fibroblast product and its</text>
<text x="80" y="958" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">specific epithelial consequence.</text>
<rect x="562" y="863" width="476" height="162" rx="12" fill="#F5F7FA" stroke="#F5F7FA" stroke-width="2"/>
<text x="582" y="895.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#20323C">A measurement must decide</text>
<text x="582" y="933" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">Measure actual output and recovery separately</text>
<text x="582" y="958" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">from support-cell abundance.</text>
<rect x="1064" y="863" width="476" height="162" rx="12" fill="#F5F7FA" stroke="#F5F7FA" stroke-width="2"/>
<text x="1084" y="895.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#20323C">Keep the negative pilot</text>
<text x="1084" y="933" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">The failed proxy model does not justify inventing a</text>
<text x="1084" y="958" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">mediator or trying scores until positive.</text>
<text x="60" y="1059" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#5B6D77">Current evidence: The TGF-beta-hallmark/HPCS-proxy pilot found no aggregate held-out gain. The question is not yet a complete wet-test hypothesis.</text>
