<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1240" viewBox="0 0 1680 1240" role="img" aria-labelledby="title desc"><title id="title">A28</title><desc id="desc">Original hypothesis illustration of a proposed experimental design. Dishes, markers and positions are qualitative and stand for conditions, not for measured values. Read the full caption and sources.</desc>
<rect x="0" y="0" width="1680" height="1240" rx="0" fill="white"/>
<text x="72" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#2E8B86" letter-spacing="1">A28</text>
<text x="118" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#9AA8B0" letter-spacing="2">PROPOSED EXPERIMENTAL DESIGN</text>
<text x="1608" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="end" fill="#9AA8B0" letter-spacing="1">HYPOTHESIS ILLUSTRATION · NOT A RESULT</text>
<line x1="72" y1="66" x2="1608" y2="66" stroke="#E4EAEE" stroke-width="1.4"/>
<text x="72" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="600" text-anchor="start" fill="#33434D">Do the two arms of the pathogenicity score move one at a time, or together?</text>
<text x="72" y="156" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#6B7B85">The score is pro-inflammatory minus pro-regulatory, so it can rise either way. In the deposited data each perturbation moved one arm only — and a different</text>
<text x="72" y="183" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#6B7B85">arm each time. Stain both arms in the same cell under both perturbations and the question is settled on the joint distribution, which no RNA summary can</text>
<text x="72" y="210" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#6B7B85">give.</text>
<text x="72" y="271" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#9AA8B0" letter-spacing="2">CULTURE ARMS · NAIVE CD4 T CELLS, MOUSE AS UNIT</text>
<line x1="72" y1="281" x2="1608" y2="281" stroke="#E4EAEE" stroke-width="1.2"/>
<ellipse cx="264.0" cy="379" rx="40" ry="40" fill="#EAF1F5" stroke="#E4EAEE" stroke-width="1.6"/>
<ellipse cx="264.0" cy="379" rx="32" ry="32" fill="white" stroke="none" stroke-width="0"/>
<ellipse cx="251.0" cy="370" rx="5.2" ry="5.2" fill="#92A1AA" stroke="#92A1AA" stroke-width="0"/>
<ellipse cx="275.0" cy="367" rx="5.2" ry="5.2" fill="#92A1AA" stroke="#92A1AA" stroke-width="0"/>
<ellipse cx="280.0" cy="387" rx="5.2" ry="5.2" fill="#92A1AA" stroke="#92A1AA" stroke-width="0"/>
<ellipse cx="255.0" cy="391" rx="5.2" ry="5.2" fill="#92A1AA" stroke="#92A1AA" stroke-width="0"/>
<ellipse cx="264.0" cy="378" rx="5.2" ry="5.2" fill="#92A1AA" stroke="#92A1AA" stroke-width="0"/>
<text x="264.0" y="339" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#92A1AA" letter-spacing="1">ARM 1</text>
<text x="264.0" y="447" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#33434D">Th17n, 25 mM glucose</text>
<text x="98.0" y="473" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">Reference condition. TGF-β + IL-6.</text>
<line x1="456.0" y1="317" x2="456.0" y2="513" stroke="#E4EAEE" stroke-width="1.0"/>
<ellipse cx="648.0" cy="379" rx="40" ry="40" fill="#EAF1F5" stroke="#E4EAEE" stroke-width="1.6"/>
<ellipse cx="648.0" cy="379" rx="32" ry="32" fill="white" stroke="none" stroke-width="0"/>
<ellipse cx="635.0" cy="370" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="659.0" cy="367" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="664.0" cy="387" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="639.0" cy="391" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="648.0" cy="378" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<text x="648.0" y="339" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C86B0" letter-spacing="1">ARM 2</text>
<text x="648.0" y="447" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#33434D">Th17n, 1 mM glucose</text>
<text x="482.0" y="473" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">Nutrient restriction. The perturbation</text>
<text x="482.0" y="493" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">that moved the regulatory arm.</text>
<line x1="840.0" y1="317" x2="840.0" y2="513" stroke="#E4EAEE" stroke-width="1.0"/>
<ellipse cx="1032.0" cy="379" rx="40" ry="40" fill="#EAF1F5" stroke="#E4EAEE" stroke-width="1.6"/>
<ellipse cx="1032.0" cy="379" rx="32" ry="32" fill="white" stroke="none" stroke-width="0"/>
<ellipse cx="1019.0" cy="370" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="1043.0" cy="367" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="1048.0" cy="387" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="1023.0" cy="391" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="1032.0" cy="378" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<ellipse cx="1011.0" cy="381" rx="5.2" ry="5.2" fill="#4C86B0" stroke="#4C86B0" stroke-width="0"/>
<text x="1032.0" y="339" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C86B0" letter-spacing="1">ARM 3</text>
<text x="1032.0" y="447" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#33434D">Th17p cytokines</text>
<text x="866.0" y="473" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">IL-1β + IL-6 + IL-23. The perturbation</text>
<text x="866.0" y="493" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">that moved the effector arm.</text>
<line x1="1224.0" y1="317" x2="1224.0" y2="513" stroke="#E4EAEE" stroke-width="1.0"/>
<ellipse cx="1416.0" cy="379" rx="40" ry="40" fill="#EAF1F5" stroke="#E4EAEE" stroke-width="1.6"/>
<ellipse cx="1416.0" cy="379" rx="32" ry="32" fill="white" stroke="none" stroke-width="0"/>
<ellipse cx="1403.0" cy="370" rx="5.2" ry="5.2" fill="#C98A5B" stroke="#C98A5B" stroke-width="0"/>
<ellipse cx="1427.0" cy="367" rx="5.2" ry="5.2" fill="#C98A5B" stroke="#C98A5B" stroke-width="0"/>
<ellipse cx="1432.0" cy="387" rx="5.2" ry="5.2" fill="#C98A5B" stroke="#C98A5B" stroke-width="0"/>
<ellipse cx="1407.0" cy="391" rx="5.2" ry="5.2" fill="#C98A5B" stroke="#C98A5B" stroke-width="0"/>
<text x="1416.0" y="339" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#C98A5B" letter-spacing="1">ARM 4</text>
<text x="1416.0" y="447" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#33434D">Arm 2 + division matched</text>
<text x="1250.0" y="473" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">Growth held constant, so a division effect</text>
<text x="1250.0" y="493" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">cannot masquerade as competence.</text>
<text x="72" y="537" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#9AA8B0" letter-spacing="2">MEASURED ON EVERY ARM</text>
<line x1="72" y1="547" x2="1608" y2="547" stroke="#E4EAEE" stroke-width="1.2"/>
<rect x="72.0" y="581" width="370.5" height="112" rx="12" fill="#FBFCFD" stroke="#E4EAEE" stroke-width="1.2"/>
<rect x="72.0" y="581" width="4" height="112" rx="0" fill="#5B9B86"/>
<text x="92.0" y="613" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#33434D">Foxp3 + CTLA4 protein</text>
<text x="92.0" y="639" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">Intracellular stain, per cell. The</text>
<text x="92.0" y="659" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">regulatory arm, measured as protein rather</text>
<text x="92.0" y="679" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">than as a module score.</text>
<rect x="460.5" y="581" width="370.5" height="112" rx="12" fill="#FBFCFD" stroke="#E4EAEE" stroke-width="1.2"/>
<rect x="460.5" y="581" width="4" height="112" rx="0" fill="#C97F63"/>
<text x="480.5" y="613" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#33434D">IL-17A + IL-17F protein</text>
<text x="480.5" y="639" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">Same cells, same stain panel. The effector</text>
<text x="480.5" y="659" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">arm. Both arms in one cell is the whole</text>
<text x="480.5" y="679" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">point.</text>
<rect x="849.0" y="581" width="370.5" height="112" rx="12" fill="#FBFCFD" stroke="#E4EAEE" stroke-width="1.2"/>
<rect x="849.0" y="581" width="4" height="112" rx="0" fill="#C98A5B"/>
<text x="869.0" y="613" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#33434D">Division tracker</text>
<text x="869.0" y="639" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">Dye dilution. Low glucose slows division,</text>
<text x="869.0" y="659" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">and cycle phase was regressed out of the</text>
<text x="869.0" y="679" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">published latent space.</text>
<rect x="1237.5" y="581" width="370.5" height="112" rx="12" fill="#FBFCFD" stroke="#E4EAEE" stroke-width="1.2"/>
<rect x="1237.5" y="581" width="4" height="112" rx="0" fill="#4C86B0"/>
<text x="1257.5" y="613" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#33434D">Joint distribution</text>
<text x="1257.5" y="639" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">The endpoint is the 2-D distribution per</text>
<text x="1257.5" y="659" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">mouse, not two marginal means. 4 arms × ≥3</text>
<text x="1257.5" y="679" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">mice.</text>
<text x="72" y="731" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#9AA8B0" letter-spacing="2">WHAT EACH OUTCOME WOULD MEAN</text>
<line x1="72" y1="741" x2="1608" y2="741" stroke="#E4EAEE" stroke-width="1.2"/>
<text x="92" y="781" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#9AA8B0" letter-spacing="1">IF THE READOUT SHOWS</text>
<text x="704" y="781" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#9AA8B0" letter-spacing="1">THEN</text>
<rect x="72" y="793" width="1536" height="58" rx="8" fill="#FBFCFD"/>
<rect x="72" y="802" width="4" height="40" rx="2" fill="#4C86B0"/>
<text x="92" y="817" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#33434D">Arm 2: Foxp3 and CTLA4 fall, IL-17 unchanged. Arm 3: IL-17 rises, Foxp3</text>
<text x="92" y="836" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#33434D">and CTLA4 unchanged.</text>
<text x="704" y="817" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">The two competences are separately regulated. A one-sided score move is a real biological statement, and the two</text>
<text x="704" y="836" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">perturbations must be reported as different cell states.</text>
<rect x="72" y="860" width="4" height="34" rx="2" fill="#C98A5B"/>
<text x="92" y="875" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#33434D">Both arms move reciprocally in both arms 2 and 3.</text>
<text x="704" y="875" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">One latent axis. The one-sided move was a property of gene lists built from opposing polarisations; report the</text>
<text x="704" y="894" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">score as a single axis.</text>
<rect x="72" y="903" width="1536" height="52" rx="8" fill="#FBFCFD"/>
<rect x="72" y="912" width="4" height="34" rx="2" fill="#C98A5B"/>
<text x="92" y="927" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#33434D">The cells losing Foxp3 are not the cells gaining IL-17.</text>
<text x="704" y="927" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">Composition, not within-cell transition — the same reading the glucose decomposition reached, and the score is</text>
<text x="704" y="946" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">tracking a mixture.</text>
<rect x="72" y="964" width="4" height="34" rx="2" fill="#C98A5B"/>
<text x="92" y="979" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#33434D">Arm 4 abolishes the effect seen in arm 2.</text>
<text x="704" y="979" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">A division confound. Neither arm claim survives, and any future comparison must be growth-matched.</text>
<rect x="72" y="1007" width="1536" height="52" rx="8" fill="#FBFCFD"/>
<rect x="72" y="1016" width="4" height="34" rx="2" fill="#92A1AA"/>
<text x="92" y="1031" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#33434D">Mouse-to-mouse variation exceeds the arm differences.</text>
<text x="704" y="1031" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7B85">Inconclusive at this precision. Report the achieved precision; do not add conditions to recover a sign.</text>
<line x1="72" y1="1126" x2="1608" y2="1126" stroke="#E4EAEE" stroke-width="1.2"/>
<text x="72" y="1148" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">Dishes and markers stand for conditions and cells, not for measured values; no count, size or position here is data.</text>
<text x="72" y="1170" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#6B7B85">The design is proposed and unexecuted. Nothing here certifies a mechanism, a protein measurement or laboratory access.</text>
<a href="https://github.com/xorca0711/scRNA_seq/blob/924999dca7bad11b9da6feddadc87dfc6a312db7/docs/research_dossiers/A28.md"><rect x="72" y="1182" width="330" height="24" fill="transparent"/></a>
<text x="72" y="1200" font-family="Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#2E8B86">Dossier: docs/research_dossiers/A28.md</text>
<text x="1608" y="1148" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="end" fill="#9AA8B0">v1 qualitative hypothesis illustration</text>
