<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc"><title id="title">A16</title><desc id="desc">Original hypothesis illustration. Arrows show the labeled proposed comparison, not observed results. Cell counts and shapes are qualitative. Read the full caption and sources.</desc>
