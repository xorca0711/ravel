<text x="60" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#168F91">A16  /  HYPOTHESIS AND RIVAL</text>
<text x="1540" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="end" fill="#BC653D">SPECIFICATION GAP REMAINS</text>
<text x="60" y="101.0" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="600" text-anchor="start" fill="#20323C">Does epithelial CD177 mark a later-response phenotype?</text>
<text x="60" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">Epithelial CD177 protein may identify a priming phenotype within comparable mutant transitional cells that differs in a later response. It is a candidate</text>
<text x="60" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">marker, not a proposed causal fate regulator. Source/protein attribution and one specific later response still need qualification; the corrected RNA</text>
<text x="60" y="223" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">comparison attenuated after improved starting-state matching.</text>
