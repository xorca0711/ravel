<text x="1540" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="end" fill="#168F91">PROPOSED / QUALIFICATION REMAINS</text>
<text x="60" y="101.0" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="600" text-anchor="start" fill="#20323C">Does the CD8 age contrast differ between spleen and marrow?</text>
<text x="60" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">At a fixed, independently defined CD8 state and comparable sampling scale, the older-versus-younger change in local clone concentration differs</text>
<text x="60" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">between spleen and marrow. This is a tissue-context association hypothesis, not evidence that a particular local niche causes expansion.</text>
