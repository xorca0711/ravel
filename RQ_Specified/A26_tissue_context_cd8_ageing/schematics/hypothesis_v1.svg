<text x="80" y="958" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">have precedent. Exact endpoint and value need</text>
<text x="80" y="983" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20323C">justification.</text>
