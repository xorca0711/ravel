<polygon points="1219,420 1205.49329346471,426.52448301166845 1205.49329346471,413.47551698833155" fill="#7951B2" stroke="#7951B2" stroke-width="2"/>
<text x="1072.5" y="378" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#7951B2">traced output?</text>
<text x="85" y="562" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#BC653D">SURVIVAL / PARALLEL-INJURY RIVAL</text>
