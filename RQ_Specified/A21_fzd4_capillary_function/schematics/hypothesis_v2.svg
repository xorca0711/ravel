<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc"><title id="title">A21</title><desc id="desc">Original hypothesis illustration. Arrows show the labeled proposed comparison, not observed results. Cell counts and shapes are qualitative. Read the full caption and sources.</desc>
<rect x="0" y="0" width="1600" height="1200" rx="0" fill="white" stroke="white" stroke-width="2"/>
<text x="60" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#168F91">A21  /  HYPOTHESIS AND RIVAL</text>
<text x="1540" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="end" fill="#7951B2">CONDITIONAL BIOLOGICAL COMPARISON</text>
<text x="60" y="101.0" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="600" text-anchor="start" fill="#20323C">Does Fzd4-dependent integrity permit capillary renewal?</text>
<text x="60" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">Fzd4-dependent capillary integrity may permit gCap self-renewal and subsequent aerocyte production during normal adult alveolar repair. The</text>
<text x="60" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">proposed route links vascular function to lineage output; it must be distinguished from direct regenerative entry, endothelial survival and parallel injury</text>
<text x="60" y="223" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#20323C">responses. Tumor-vessel rescue is a precedent, not evidence that this complete adult repair route has been demonstrated.</text>
