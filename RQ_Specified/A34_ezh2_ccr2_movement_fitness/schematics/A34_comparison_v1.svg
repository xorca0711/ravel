<text x="36" y="87" font-family="Arial, sans-serif" font-size="27" fill="#20383d">Which movement and fitness responses accompany Ezh2-associated CCR2 reduction in</text>
<text x="36" y="121" font-family="Arial, sans-serif" font-size="27" fill="#20383d">Tregs?</text>
