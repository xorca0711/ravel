<text x="984" y="265" font-family="Arial, sans-serif" font-size="21" fill="#20383d">Possible outcomes</text>
<text x="984" y="325" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Movement only / fitness</text>
<text x="984" y="350" font-family="Arial, sans-serif" font-size="18" fill="#20383d">only</text>
<text x="984" y="389" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Both / neither</text>
<text x="984" y="428" font-family="Arial, sans-serif" font-size="18" fill="#20383d">CCR2 attribution still open</text>
