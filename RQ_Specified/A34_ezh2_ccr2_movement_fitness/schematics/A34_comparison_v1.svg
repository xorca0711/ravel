<rect x="656" y="180" width="280" height="292" rx="12" fill="white" stroke="#9fb9b3"/>
<ellipse cx="689" cy="215" rx="15" ry="15" fill="#d5e8df" stroke="#176b77"/>
<text x="718" y="221" font-family="Arial, sans-serif" font-size="20" fill="#176b77">3</text>
<text x="674" y="265" font-family="Arial, sans-serif" font-size="21" fill="#20383d">Separate endpoints</text>
<text x="674" y="325" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Directed movement</text>
<text x="674" y="364" font-family="Arial, sans-serif" font-size="18" fill="#20383d">CD25 / pSTAT5</text>
<text x="674" y="403" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Viable recovery</text>
