<text x="54" y="265" font-family="Arial, sans-serif" font-size="21" fill="#20383d">Matched Tregs</text>
<text x="54" y="325" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Ezh2 loss / control</text>
