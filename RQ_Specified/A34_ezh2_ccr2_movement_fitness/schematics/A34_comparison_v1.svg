<text x="408" y="221" font-family="Arial, sans-serif" font-size="20" fill="#176b77">2</text>
<text x="364" y="265" font-family="Arial, sans-serif" font-size="21" fill="#20383d">Separate contexts</text>
<text x="364" y="325" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Ligand gradient</text>
<text x="364" y="364" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Inflammatory context</text>
<text x="364" y="403" font-family="Arial, sans-serif" font-size="18" fill="#20383d">Common accessory source</text>
