<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660">
<title>A34 hypothesis illustration</title>
<desc>After common activation, Ezh2-deficient murine Tregs may show a CCR2-related directed-movement deficit, an inflammatory-context fitness deficit, both, or neither. The first comparison estimates those separate genotype-associated responses; attribution to CCR2 requires a target-restricted test and qualified genetic background.</desc>
